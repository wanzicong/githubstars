# ============================================================
# GitHub Stars — 测试环境 Docker 配置
# ============================================================
# 启动: docker-compose -f docker-compose.test.yml up -d
# 停止: docker-compose -f docker-compose.test.yml down -v
# 端口 3308 与开发环境 3307 隔离，避免冲突

services:
  mysql-test:
    image: mysql:8.0
    container_name: githubstars-test-db
    restart: unless-stopped
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: githubstars_test
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p123456"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - test_mysql_data:/var/lib/mysql

volumes:
  test_mysql_data:

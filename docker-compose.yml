# ============================================================
# GitHub Stars — 开发环境 Docker 配置
# ============================================================
# 启动: docker compose up -d
# 停止: docker compose down
# 清理数据: docker compose down -v
# 端口 3307 与测试环境 3308 隔离，避免冲突

# 独立项目名，避免与 docker-compose.prod.yml 的 name: githubstars 冲突
# 两个 project 互为 orphans 时会互相 recreate 容器
name: githubstars-dev

services:
  mysql:
    image: mysql:8.0
    container_name: githubstars-dev-db
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DEV_MYSQL_ROOT_PASSWORD:?DEV_MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${DEV_MYSQL_DATABASE:-githubstars}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DEV_MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - dev_mysql_data:/var/lib/mysql

  # MCP Server 独立容器 — 供外部 AI 通过 HTTP 调用
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    container_name: githubstars-mcp
    restart: unless-stopped
    ports:
      - "10005:10004"
    environment:
      # 默认连接当前 Docker 后端映射端口 :10004；如需连接本地 Nest 开发服务，可用 MCP_BACKEND_URL 覆盖为 :10002。
      GITHUBSTARS_API_URL: ${MCP_BACKEND_URL:-http://host.docker.internal:10004}
      MCP_PORT: 10004

volumes:
  dev_mysql_data:
    # 复用现有卷：之前未指定 name 时卷名为 githubstars_dev_mysql_data
    # external 告知 compose 不要试图新建，直接挂载既有卷
    name: githubstars_dev_mysql_data
    external: true

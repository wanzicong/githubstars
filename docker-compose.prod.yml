# ============================================================
# GitHub Stars — 生产环境 Docker Compose 配置
# ============================================================
# 使用方式（必须带 --env-file，否则 ${VAR} 占位符解析不到）:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d
#   docker compose -f docker-compose.prod.yml --env-file .env.production down
#   docker compose -f docker-compose.prod.yml --env-file .env.production logs -f
# ============================================================
# 前置条件:
#   1. 在项目根目录执行:
#      docker build -t githubstars-backend -f Dockerfile.backend .
#      docker build -t githubstars-frontend -f Dockerfile.frontend .
#   2. 复制 .env.production.example 为 .env.production 并填写配置
#   3. 准备 nginx/ 和 docker/ 目录（本仓库已有）
# ============================================================
# 端口规划（与本地开发环境隔离）:
#   - 前端 Nginx:  10003 (HTTP_PORT 可配置)
#   - 后端 API:    10004 (BACKEND_DEBUG_PORT 可配置，调试用)
#   - MySQL:       不暴露到宿主机（仅容器间通信）
#   - 本地开发前端: 10001 (Vite dev server，不受影响)
#   - 本地开发后端: 10002 (NestJS dev，不受影响)
#   - 本地开发MySQL: 3307 (docker-compose.yml，不受影响)
# ============================================================

name: githubstars

services:
  # ─── MySQL 数据库说明 ─────────────────────────────────────
  # 生产环境与本地开发共用一个 MySQL 实例 githubstars-dev-db，
  # 由 docker-compose.yml（name: githubstars-dev）维护。
  # backend 通过 DATABASE_URL（.env.production）直连 githubstars-dev-db:3306，
  # 不再启动独立的生产 MySQL 容器。

  # ─── NestJS 后端 ─────────────────────────────────────────
  backend:
    image: githubstars-backend
    container_name: githubstars-backend
    restart: unless-stopped

    # 后端端口
    # - expose: 容器间通信（Nginx 通过 Docker 网络访问）
    # - ports:  可选调试端口映射到宿主机（方便 curl 测试）
    expose:
      - "10002"
    ports:
      # 调试端口：宿主机 10004 → 容器 10002
      # 生产环境可注释掉此行，仅通过 Nginx 访问
      - "${BACKEND_DEBUG_PORT:-10004}:10002"

    # 不再依赖独立的生产 MySQL 容器，backend 通过 DATABASE_URL 直连 githubstars-dev-db
    # githubstars-dev-db 由 docker-compose.yml（name: githubstars-dev）维护，并加入 githubstars-network
    # depends_on:
    #   mysql:
    #     condition: service_healthy

    env_file:
      - .env.production

    environment:
      # 容器内 DATABASE_URL 指向 mysql 容器名
      DATABASE_URL: ${DATABASE_URL}
      PORT: 10002
      NODE_ENV: production
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:10003}
      # 克隆/下载文件在容器内的基础路径（通过卷挂载到宿主机）
      CLONE_BASE_DIR: /app/data/clones
      DOWNLOAD_BASE_DIR: /app/data/downloads
      # Claude Agent SDK 子进程凭据
      # 容器无法访问宿主机 127.0.0.1，必须通过 host.docker.internal 访问本机代理
      # 代理本身不校验 token，使用占位符即可（与本机 settings.json 的 PROXY_MANAGED 对齐）
      # 注意：必须写死，不能用 ${VAR:-default} 形式，否则宿主机 shell 的 127.0.0.1 会覆盖
      ANTHROPIC_BASE_URL: http://host.docker.internal:15721
      ANTHROPIC_AUTH_TOKEN: PROXY_MANAGED

    # 数据卷挂载 — 将宿主机目录映射到容器内
    # 用户可直接在宿主机访问克隆/下载的文件
    volumes:
      # 克隆的 Git 仓库（用户指定 targetDir 时，容器内路径前缀为 /app/data/clones）
      - ${CLONE_DATA_DIR:-./data/clones}:/app/data/clones
      # 下载的源码压缩包
      - ${DOWNLOAD_DATA_DIR:-./data/downloads}:/app/data/downloads
      # 应用日志
      - ${LOG_DATA_DIR:-./data/logs}:/app/data/logs
      # ─── Claude Code 配置映射 ─────────────────────────────
      # 将宿主机 Claude Code 配置映射到容器内，支持本地修改配置
      # 容器内路径: /root/.claude/
      - ${CLAUDE_CONFIG_DIR:-./docker/claude-config}/settings.json:/root/.claude/settings.json
      - ${CLAUDE_CONFIG_DIR:-./docker/claude-config}/settings.local.json:/root/.claude/settings.local.json
      - ${CLAUDE_CONFIG_DIR:-./docker/claude-config}/config.json:/root/.claude/config.json
      - ${CLAUDE_CONFIG_DIR:-./docker/claude-config}/CLAUDE.md:/root/.claude/CLAUDE.md

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:10002/api/docs-json"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

    networks:
      - githubstars-network

    # CPU/内存限制（根据实际情况调整）
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # ─── Nginx 前端（反向代理 + 静态文件）─────────────────
  frontend:
    image: githubstars-frontend
    container_name: githubstars-frontend
    restart: unless-stopped

    # 前端端口映射到宿主机（避开本地开发 10001）
    ports:
      - "${HTTP_PORT:-10003}:80"
      # 如需 HTTPS，取消注释并配置 SSL
      # - "443:443"

    depends_on:
      backend:
        condition: service_started

    networks:
      - githubstars-network

    # CPU/内存限制
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M


# ─── 持久化卷 ──────────────────────────────────────────────
# 无共享卷：MySQL 数据由 githubstars-dev 项目管理（githubstars_dev_mysql_data）


# ─── 网络 ───────────────────────────────────────────────────
networks:
  githubstars-network:
    name: githubstars-network
    driver: bridge

# ============================================================
# GitHub Stars — Nginx 生产配置文件
# ============================================================
# Nginx 作为反向代理 + 静态文件服务器
# 前端 SPA 由 Nginx 直接 Serve，API 请求反向代理到后端容器
# ============================================================

upstream backend {
    server backend:10002;
    # 如果有多实例后端，可在此添加多个 server
    # server backend:10002 weight=1;
    # server backend:10003 weight=1;
}

# ─── HTTP → HTTPS 重定向（生产建议启用）────────────────────
# 如果使用 HTTPS，取消以下注释并配置 SSL 证书
# server {
#     listen 80;
#     server_name your-domain.com;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80;
    server_name localhost;
    # 如果有域名，替换 localhost 为实际域名

    # ── 字符编码 ──
    charset utf-8;

    # ── Gzip 压缩 ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        image/x-icon;

    # ── 安全头 ──
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── 日志 ──
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;


    # ═══════════════════════════════════════════════════════════
    # 前端 SPA — 静态文件服务
    # ═══════════════════════════════════════════════════════════
    location / {
        root /usr/share/nginx/html;
        index index.html;

        # SPA fallback: 所有非文件路由 → index.html
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存（带 hash 的文件可长期缓存）
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }


    # ═══════════════════════════════════════════════════════════
    # API 代理 — /api/* 直接透传到后端
    # ═══════════════════════════════════════════════════════════
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 流式响应（SSE）支持 — 禁用缓冲
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # 超时配置
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 300s;
    }

    # Swagger API 文档
    location /api/docs {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# ============================================================
# GitHub Stars — Nginx 生产配置文件
# ============================================================
# Nginx 作为反向代理 + 静态文件服务器
# 前端 SPA 由 Nginx 直接 Serve，API 请求反向代理到后端容器
# ============================================================

upstream backend {
    server backend:10002;
    # 如果有多实例后端，可在此添加多个 server
    # server backend:10002 weight=1;
    # server backend:10003 weight=1;
}

# ─── SPA 回退: 检测浏览器 HTML 导航请求 ────────────────────
# Vite dev 模式通过 bypass 做同样的事，此处是 Nginx 等价实现
map $http_accept $is_browser_request {
    default       0;
    "~text/html"  1;
}

# ─── HTTP → HTTPS 重定向（生产建议启用）────────────────────
# 如果使用 HTTPS，取消以下注释并配置 SSL 证书
# server {
#     listen 80;
#     server_name your-domain.com;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80;
    server_name localhost;
    # 如果有域名，替换 localhost 为实际域名

    # ── 字符编码 ──
    charset utf-8;

    # ── Gzip 压缩 ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        image/x-icon;

    # ── 安全头 ──
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── 日志格式 ──
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;


    # ═══════════════════════════════════════════════════════════
    # 前端 SPA — 静态文件服务
    # ═══════════════════════════════════════════════════════════
    location / {
        root /usr/share/nginx/html;
        index index.html;

        # SPA fallback: 所有非文件路由 → index.html
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存（带 hash 的文件可长期缓存）
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }


    # ═══════════════════════════════════════════════════════════
    # API 代理 — /api/* 直接透传到后端
    # ═══════════════════════════════════════════════════════════
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 流式响应（SSE）支持 — 禁用缓冲
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # 超时配置
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 300s;
    }

    # Swagger API 文档
    location /api/docs {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }


    # ═══════════════════════════════════════════════════════════
    # 以下路径与前端 Vite 开发代理保持一致 (vite.config.ts)
    # 需要 URL 重写：/xxx → /api/xxx
    # ═══════════════════════════════════════════════════════════

    # /sync → /api/sync（重写 + SPA 回退）
    # ⚠️ /sync 也是前端 SPA 路由，HTML 导航需返回 index.html
    location /sync {
        # 浏览器直接访问时返回 SPA
        if ($is_browser_request) {
            rewrite ^ /index.html last;
        }
        rewrite ^(/sync.*)$ /api$1 break;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # /authors → /api/authors（重写 + SPA 回退）
    # ⚠️ /authors 也是前端 SPA 路由，HTML 导航需返回 index.html
    location /authors {
        # 浏览器直接访问时返回 SPA
        if ($is_browser_request) {
            rewrite ^ /index.html last;
        }
        rewrite ^(/authors.*)$ /api$1 break;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # /export → /api/export（重写）
    location /export {
        rewrite ^(/export.*)$ /api$1 break;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # /stars/export → /api/stars/export（重写）
    location /stars/export {
        rewrite ^(/stars/export.*)$ /api$1 break;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
}
